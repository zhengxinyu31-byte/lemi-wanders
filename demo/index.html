<style>
:root{
  --gold:#C5A572;--gold-deep:#A6864F;--rose:#D98C90;--rose-soft:#F3DEDC;
  --seine:#8FA3B0;--seine-deep:#5E7688;
  --cream:#F7F1E7;--paper:#FCFAF5;--ink:#3A342B;--ink-soft:#867B69;--line:#EADFCC;
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --fd:"Playfair Display",serif;--fs:"Noto Serif SC",serif;--fu:"Noto Sans SC",sans-serif;--fh:"Dancing Script",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fu);color:var(--ink);background:var(--cream);overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--line);z-index:30}
.brand{font-family:var(--fd);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:9px;cursor:pointer}
.hamster{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0d9a8,#c99a5a);border:1.5px solid #a97e42;position:relative;flex-shrink:0}
.hamster::after{content:"";position:absolute;top:-4px;left:3px;width:22px;height:8px;background:var(--seine-deep);border-radius:8px 8px 3px 3px;transform:rotate(-8deg)}
.brand small{font-family:var(--fh);color:var(--rose);font-size:.95rem;margin-left:2px}
.top-right{display:flex;align-items:center;gap:12px}
.crumb{font-size:.74rem;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.crumb b{color:var(--gold-deep)}.crumb .sep{opacity:.5}
.lang{font-size:.74rem;font-weight:700;color:var(--ink-soft);cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:5px 11px;background:var(--paper)}
.lang:hover{border-color:var(--gold)}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .4s}
.view.active{opacity:1;pointer-events:auto}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(217,140,144,.6)}100%{box-shadow:0 0 0 16px rgba(217,140,144,0)}}
/* WORLD */
.world{position:absolute;inset:0}
.w-ov{position:absolute;top:26px;left:0;right:0;text-align:center;pointer-events:none;padding:0 20px;z-index:5}
.w-ov h1{font-family:var(--fd);font-style:italic;font-size:1.9rem;color:var(--ink);text-shadow:0 2px 12px #fff,0 0 30px #fff}
.w-ov p{font-family:var(--fs);font-size:.82rem;color:var(--ink);margin-top:6px;text-shadow:0 1px 8px #fff,0 0 20px #fff}
/* HUB */
.hub{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.hub-in{max-width:1140px;margin:0 auto;padding:24px 30px 56px}
.hub-search{position:relative;max-width:540px;margin:0 auto}
.chs{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:12px 18px}
.chs:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px var(--rose-soft)}
.chs .mag{width:16px;height:16px;border:2px solid var(--seine-deep);border-radius:50%;position:relative;flex-shrink:0}
.chs .mag::after{content:"";position:absolute;width:6px;height:2px;background:var(--seine-deep);bottom:-3px;right:-4px;transform:rotate(45deg)}
.chs input{border:none;background:none;outline:none;font-family:var(--fu);font-size:.9rem;color:var(--ink);width:100%}
.stats{display:flex;justify-content:center;gap:24px;margin:16px 0 20px;font-size:.7rem;color:var(--ink-soft)}
.stats b{font-family:var(--fd);color:var(--gold-deep);font-size:1rem;margin-right:4px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.tabs button{font-family:var(--fu);font-size:.74rem;font-weight:700;padding:8px 15px;border-radius:16px;background:var(--cream);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;transition:.2s}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold-deep)}
.suggest{position:absolute;left:0;right:0;top:50px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 16px 38px -18px rgba(120,90,50,.5);overflow:hidden;display:none;z-index:12}
.suggest.show{display:block}
.sg{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.sg:last-child{border-bottom:none}.sg:hover,.sg.hl{background:var(--cream)}
.sgt{font-size:.56rem;font-weight:700;color:#fff;border-radius:7px;padding:2px 6px;flex-shrink:0}
.sgt.poi{background:var(--rose)}.sgt.person{background:var(--seine-deep)}.sgt.work{background:var(--gold-deep)}
.sgb{flex:1}.sgb .nm{font-weight:700;font-size:.83rem}.sgb .ds{font-size:.66rem;color:var(--ink-soft)}
.sgc{font-size:.56rem;color:var(--gold-deep);background:var(--rose-soft);border-radius:7px;padding:2px 6px}
.sgr{font-size:.58rem;color:var(--seine-deep);background:var(--cream);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
.sg.wait{opacity:.6}.sg.wait .wb{font-size:.54rem;font-weight:700;color:#fff;background:#b3ab99;border-radius:7px;padding:2px 6px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:880px){.wall{grid-template-columns:1fr 1fr}}
.sc{border-radius:var(--r-md);overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;box-shadow:0 12px 28px -20px rgba(120,90,50,.6);transition:transform .25s,box-shadow .25s}
.sc:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(120,90,50,.7)}
.sc .po{height:142px;position:relative;display:flex;align-items:flex-end;padding:13px;background:linear-gradient(135deg,var(--rose),var(--gold));background-size:cover;background-position:center}
.sc .po::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(40,28,12,.72),transparent 62%)}
.sc .po h3{font-family:var(--fd);font-style:italic;color:#fff;font-size:1.25rem;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.5);position:relative;z-index:1}
.sc .pm{position:absolute;bottom:11px;right:11px;width:42px;height:42px;border-radius:50%;border:2px dashed rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:.5rem;color:#fff;transform:rotate(-12deg);text-align:center;line-height:1;z-index:1}
.sc .bd{padding:12px 14px}
.sc .mt{display:flex;gap:9px;font-size:.62rem;color:var(--ink-soft);margin-bottom:6px}
.sc .mt .pin{color:var(--rose);font-weight:700}
.sc .ch{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sc .ch span{font-size:.56rem;color:var(--gold-deep);background:var(--rose-soft);border-radius:7px;padding:2px 6px}
.sc .de{font-family:var(--fs);font-size:.78rem;color:var(--ink-soft);line-height:1.55}
.sc.locked{opacity:.6}.sc.locked .po{background:linear-gradient(135deg,#c9c2b4,#a59d8c)}
.lk{position:absolute;top:9px;left:10px;background:rgba(58,52,43,.75);color:#fff;font-size:.54rem;font-weight:700;border-radius:11px;padding:3px 8px;z-index:1}
/* timeline view */
.tl-hint{text-align:center;font-size:.72rem;color:var(--ink-soft);margin-bottom:18px}
.tl{max-width:760px;margin:0 auto}
.tl-ch{margin-bottom:26px;position:relative;padding-left:20px;border-left:2px solid var(--line)}
.tl-cn{font-family:var(--fd);font-style:italic;font-size:1.05rem;color:var(--gold-deep);margin-bottom:12px}
.tl-cn::before{content:"";position:absolute;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--paper)}
.tl-row{display:flex;flex-wrap:wrap;gap:14px}
.tl-star{cursor:pointer;text-align:center;transition:transform .2s}
.tl-star:hover{transform:translateY(-3px)}
.tl-dot{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fbe6c0,var(--gold));color:#fff;font-family:var(--fd);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -4px var(--gold-deep);border:2px solid #fff;margin:0 auto}
.tl-nm{font-size:.64rem;color:var(--ink);margin-top:5px;max-width:74px}
/* filters */
.filters{display:flex;gap:7px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.fb{font-family:var(--fu);font-size:.7rem;font-weight:700;padding:6px 13px;border-radius:14px;background:var(--cream);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;transition:.2s}
.fb.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.home-map{height:440px;border-radius:var(--r-md);overflow:hidden;position:relative;border:1px solid var(--line)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(252,250,245,.93);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:.64rem;color:var(--ink-soft);z-index:4}
.legend .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--rose)}
.theme{display:flex;flex-wrap:wrap;gap:11px}
.tc{font-family:var(--fu);font-size:.8rem;font-weight:700;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:9px 16px;cursor:pointer;transition:.2s}
.tc:hover{border-color:var(--gold);color:var(--gold-deep)}
.tc .c{font-size:.64rem;color:var(--ink-soft);margin-left:6px;font-weight:400}
/* 叙事语义高亮 */
.hl-w{color:var(--gold-deep);font-weight:600}
.hl-p{color:var(--seine-deep);font-weight:600}
.hl-t{color:var(--rose);font-weight:600}
.hl-l{color:#8a7a3f;border-bottom:1px dotted #c7b88a}
#view-line .ph-line{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--fs)}
.note{position:fixed;left:14px;bottom:12px;font-family:var(--fs);font-size:.62rem;color:var(--ink-soft);background:rgba(252,250,245,.9);border:1px solid var(--line);border-radius:11px;padding:5px 11px;z-index:120;max-width:320px}
</style>
</head>

<script>

var hubMap=null,curTab='wall',curFilter='全部';

/* shared marker element */
function markerEl(i,cls){
  var d=document.createElement('div');d.className='mk '+(cls||'');
  d.style.cssText='width:30px;height:38px;cursor:pointer;transform:translateY(-4px);position:relative';
  d.innerHTML='<svg viewBox="0 0 30 38" style="width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(60,40,10,.5))">'
    +'<path class="hd" d="M15,2 C22,2 28,7 28,14 C28,24 15,36 15,36 C15,36 2,24 2,14 C2,7 8,2 15,2 Z" fill="#fff" stroke="#5E7688" stroke-width="2"/>'
    +'<text x="15" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#5E7688">'+(i+1)+'</text></svg>';
  return d;
}
function cityMarkerEl(c){
  var d=document.createElement('div');d.style.cssText='cursor:'+(c.open?'pointer':'default')+';text-align:center;transform:translateY(-6px)';
  var dot=c.open?'#D98C90':'#b3ab99';
  d.innerHTML='<div style="width:16px;height:16px;border-radius:50%;background:'+dot+';border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);margin:0 auto'+(c.open?';animation:pulse2 2s ease-out infinite':'')+'"></div>'
    +'<div style="font-size:12px;font-weight:700;color:#3A342B;margin-top:3px;white-space:nowrap;text-shadow:0 1px 3px #fff">'+c.nm[LANG]+(c.open?'':' 🔒')+'</div>'
    +'<div style="font-size:10px;color:#867B69;white-space:nowrap">'+(c.open?(c.lines+(LANG==='zh'?' 条故事线':' line')):(LANG==='zh'?'待解锁':'locked'))+'</div>';
  return d;
}

/* ---- WORLD MAP: real MapLibre ---- */

/* ---- HUB tabs ---- */
function setTab(tab,btn){
  curTab=tab;
  if(btn){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');}
  else{var bs=document.querySelectorAll('.tabs button');bs.forEach(function(b){b.classList.remove('on');});var idx={wall:0,timeline:1,map:2,theme:3}[tab]||0;if(bs[idx])bs[idx].classList.add('on');}
  if(hubMap){try{hubMap.remove();}catch(e){}hubMap=null;}
  var pane=document.getElementById('pane');
  if(tab==='wall')renderWall(pane);
  else if(tab==='timeline')renderTimeline(pane);
  else if(tab==='map')renderCityMap(pane);

}

function onSearch(v){var box=document.getElementById('suggest');sgIdx=-1;

  var tm={poi:'POI',person:'名人',work:'名作'};
  box.innerHTML=res.map(function(s,i){
    if(s.wait)return '<div class="sg wait" onclick="waitToast()"><span class="sgt '+s.type+'">'+tm[s.type]+'</span><div class="sgb"><div class="nm">'+s.nm+'</div><div class="ds">'+s.ds+'</div></div><span class="wb">待收录</span></div>';

function searchKey(e){var it=document.querySelectorAll('#suggest .sg');if(!it.length)return;

  else if(e.key==='Enter'){var s=sgList[sgIdx<0?0:sgIdx];if(s&&!s.wait&&s.go>=0)gotoStop(s.go);else if(s&&s.wait)waitToast();}
  else if(e.key==='Escape'){document.getElementById('suggest').classList.remove('show');}}

function haversine(a,b){var R=6371,r=Math.PI/180;var dLat=(b[1]-a[1])*r,dLng=(b[0]-a[0])*r;

    var kindColor={};NARR_KINDS.forEach(function(n){kindColor[n.k]=n.color;});
    var h='<div class="stc '+cls+'" data-i="'+i+'" onclick="selectStop('+i+')"><span class="nd"></span>'
      +'<div class="hd"><span class="ix">'+s.idx+' /</span><span class="nm">'+s.nm[LANG]+'</span>'
      +'<span class="bg" style="background:'+(kindColor[s.narr.scene?'scene':'history']||'#D98C90')+'">'+s.badge[LANG]+'</span>'
      +'<span class="dur">'+s.dur[LANG]+'</span></div>'
      +'<div class="en2">'+s.en2+'</div>'
      +'<div class="th" onclick="event.stopPropagation();openLB(\''+s.img+'\',\''+s.nm[LANG].replace(/\'/g,'')+'\')">'
        +'<img src="'+IMG[s.img]+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="ph">📷 '+s.nm[LANG]+'</div>'
        +'<div class="cap">📷 '+s.nm.en+'</div></div>';
    /* 四类叙事分段 */
    h+='<div class="narr">';
    NARR_KINDS.forEach(function(n){if(s.narr[n.k])h+='<div class="row"><span class="k" style="background:'+n.color+'">'+n.label[LANG]+'</span>'+highlight(s.narr[n.k][LANG])+'</div>';});
    h+='</div>';
    if(s.quote)h+='<div class="ql">“'+s.quote[LANG]+'”</div>';
    /* 关联名人名作 chip */
    if(s.related&&s.related.length){h+='<div class="rel">'+s.related.map(function(id){var e=ENTITIES[id];if(!e)return '';
      return '<span class="chip '+e.type+'" data-ent="'+id+'" onmouseenter="showEtip(event,\''+id+'\')" onmousemove="moveEtip(event)" onmouseleave="hideEtip()" onclick="event.stopPropagation();gotoEntity(\''+id+'\')"><span class="ic">'+(e.type==='person'?'👤':'📖')+'</span>'+(e.type==='work'?'《'+e.nm[LANG].replace(/[《》]/g,'')+'》':e.nm[LANG])+'</span>';
    }).join('')+'</div>';}
    /* 机位 */
    h+='<div class="sp"><b>📸 '+(LANG==='zh'?'机位':'Photo spot')+'</b> · '+s.spot[LANG]+'</div>';
    /* 背景知识 */
    if(s.know)h+='<div class="know"><b>📚 '+(LANG==='zh'?'背景知识':'Background')+'</b> · '+s.know[LANG]+'</div>';
    /* 延伸提问卡 */
    if(s.asks&&s.asks.length){h+='<div class="asks">'+s.asks.map(function(a,ai){
      return '<div class="ask" data-si="'+i+'" data-ai="'+ai+'"><div class="q" onclick="event.stopPropagation();toggleAsk('+i+','+ai+')">'+a.q[LANG]+'<span class="ar">▸</span></div><div class="a">'+a.a[LANG]+'</div></div>';
    }).join('')+'</div>';}
    /* 实用信息 */
    if(s.tips)h+='<div class="tp"><b>ℹ '+(LANG==='zh'?'实用':'Info')+'</b> · '+s.tips[LANG]+'</div>';
    /* 关系图谱(每站关联 + 跨线) */
    var gn='';(s.related||[]).forEach(function(id){var e=ENTITIES[id];if(e)gn+='<span class="gn" onclick="event.stopPropagation();gotoEntity(\''+id+'\')">'+(e.type==='person'?'👤 ':'📖 ')+e.nm[LANG].replace(/[《》]/g,'')+'</span>';});
    if(s.cross)gn+='<span class="gn cross" onclick="event.stopPropagation();crossToast()">🕸️ '+(LANG==='zh'?'存在主义左岸线 · 也讲到这里':'Left-Bank line · also here')+'</span>';
    if(gn)h+='<div class="graph"><div class="gt">🔗 '+(LANG==='zh'?'关联名人名作 / 其它故事线':'Related people, works & storylines')+'</div><div class="grow">'+gn+'</div></div>';
    return h+'</div>';
  }).join('');
}
function toggleAsk(si,ai){var el=document.querySelector('.ask[data-si="'+si+'"][data-ai="'+ai+'"]');if(el)el.classList.toggle('open');}
function crossToast(){alert(LANG==='zh'?'「存在主义左岸线」敬请期待 ✦\n(同一 POI 花神咖啡馆在多条故事线中被讲到)':'"Left-Bank Existentialism" coming soon ✦');}

/* 关联实体 tooltip */
function showEtip(ev,id){var e=ENTITIES[id];if(!e)return;var t=document.getElementById('etip');
  t.innerHTML='<div class="en">'+(e.type==='work'?'《'+e.nm[LANG].replace(/[《》]/g,'')+'》':e.nm[LANG])+'</div><div class="em">'+e.era+' · '+e.role[LANG]+'</div><div class="es">'+e.sum[LANG]+'</div>';
  t.classList.add('show');moveEtip(ev);}
function moveEtip(ev){var t=document.getElementById('etip');var x=ev.clientX+14,y=ev.clientY+14;
  if(x+230>window.innerWidth)x=ev.clientX-234;if(y+140>window.innerHeight)y=ev.clientY-150;t.style.left=x+'px';t.style.top=y+'px';}
function hideEtip(){document.getElementById('etip').classList.remove('show');}
function gotoEntity(id){var e=ENTITIES[id];if(e&&e.poi!=null){hideEtip();selectStop(e.poi);}}

function initLineMap(){
  if(lineMap){try{lineMap.remove();}catch(e){}lineMap=null;}
  var box=document.getElementById('lineMap');if(!box||!window.maplibregl)return;mkEls=[];
  lineMap=new maplibregl.Map({container:box,style:VECTOR_STYLE,center:STOPS[0].ll,zoom:13,attributionControl:false,preserveDrawingBuffer:true});
  lineMap.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  lineMap.on('load',function(){addLayers();
    lineMap.on('click',function(){if(popup){popup.remove();popup=null;}});
    curStop=0;selectStop(pendingStop||0,true);pendingStop=0;setTimeout(fitAll,150);});
}
function addLayers(){
  lineMap.addSource('future',{type:'geojson',data:fullGeo()});
  lineMap.addLayer({id:'future',type:'line',source:'future',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#8FA3B0','line-width':3,'line-dasharray':[1.5,2],'line-opacity':.5}});
  lineMap.addSource('grown',{type:'geojson',data:partialGeo(0)});
  lineMap.addLayer({id:'grown',type:'line',source:'grown',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#C5A572','line-width':5}});
  STOPS.forEach(function(s,i){var el=markerEl(i);
    el.addEventListener('click',function(ev){ev.stopPropagation();selectStop(i);});
    new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(s.ll).addTo(lineMap);mkEls.push(el);});
}
function setMk(){mkEls.forEach(function(el,i){el.classList.toggle('cur',i===curStop);
  var hd=el.querySelector('.hd'),num=el.querySelector('text');var p=i<curStop,c=i===curStop;
  if(hd){hd.setAttribute('fill',c?'#D98C90':p?'#C5A572':'#fff');hd.setAttribute('stroke',c?'#fff':p?'#A6864F':'#5E7688');}
  if(num)num.setAttribute('fill',(i<=curStop)?'#fff':'#5E7688');});}
function popHTML(s){var kc={};NARR_KINDS.forEach(function(n){kc[n.k]=n.color;});var first=s.narr.scene?'scene':(s.narr.history?'history':'work');
  return '<div class="pop"><div class="pi"><img src="'+IMG[s.img]+'" onerror="this.style.display=\'none\'"></div>'
    +'<div class="pb"><b>'+s.nm[LANG]+'</b><span class="pk" style="background:'+kc[first]+'">'+s.badge[LANG]+'</span>'
    +'<div class="pt">'+s.narr[first][LANG]+'</div><div class="ps">📸 '+s.spot[LANG]+'</div></div></div>';}
function selectStop(i,noScroll){
  curStop=i;
  document.querySelectorAll('#stops .stc').forEach(function(e,k){e.classList.toggle('active',k===i);e.classList.toggle('passed',k<i);});
  document.getElementById('clProg').textContent=(i+1)+' / '+STOPS.length;
  var s=STOPS[i];
  if(lineMap&&lineMap.getSource('grown')){lineMap.getSource('grown').setData(partialGeo(i));setMk();panTo(s.ll);
    if(popup)popup.remove();popup=new maplibregl.Popup({offset:30,closeButton:false,maxWidth:'236px'}).setLngLat(s.ll).setHTML(popHTML(s)).addTo(lineMap);}
  document.getElementById('aria').textContent='第 '+(i+1)+' 站，共 '+STOPS.length+' 站：'+s.nm[LANG];
  if(history.replaceState)history.replaceState(null,'','#stop='+(i+1));
  if(!noScroll){var c=document.querySelector('#stops .stc[data-i="'+i+'"]');if(c)document.querySelector('.cl-left').scrollTo({top:c.offsetTop-128,behavior:'smooth'});}
}
function panTo(ll){if(!lineMap)return;var p=lineMap.project(ll);var c=lineMap.getContainer();var W=c.offsetWidth,H=c.offsetHeight;
  if(p.x>W*0.22&&p.x<W*0.78&&p.y>H*0.22&&p.y<H*0.78)return;lineMap.easeTo({center:ll,duration:720,essential:true});}
function fitAll(){if(lineMap)lineMap.fitBounds(bounds(),{padding:{top:66,bottom:66,left:56,right:56},duration:680});}
function stepStop(d){var n=curStop+d;if(n<0)n=0;if(n>STOPS.length-1)n=STOPS.length-1;selectStop(n);}
function toggleAutoplay(){var b=document.getElementById('playBtn'),t=document.getElementById('playTxt');
  if(autoTimer){stopAuto();return;}b.classList.add('on');t.textContent=LANG==='zh'?'停止':'Stop';
  if(curStop>=STOPS.length-1)selectStop(0);scheduleNext();}
function scheduleNext(){if(curStop>=STOPS.length-1){stopAuto();return;}
  var d=haversine(STOPS[curStop].ll,STOPS[curStop+1].ll);var dwell=Math.max(1500,Math.min(3400,1500+d*1400));
  autoTimer=setTimeout(function(){selectStop(curStop+1);if(curStop>=STOPS.length-1)setTimeout(stopAuto,1100);else scheduleNext();},dwell);}
function stopAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
  document.getElementById('playBtn').classList.remove('on');document.getElementById('playTxt').textContent=LANG==='zh'?'自动播放':'Autoplay';}
function setBasemap(m){document.getElementById('btVec').classList.toggle('on',m==='vector');document.getElementById('btSat').classList.toggle('on',m==='sat');
  if(!lineMap)return;lineMap.setStyle(m==='sat'?SAT_STYLE:VECTOR_STYLE);
  lineMap.once('styledata',function(){setTimeout(function(){addLayers();setMk();lineMap.getSource('grown').setData(partialGeo(curStop));},60);});}
function openLB(key,cap){var im=document.getElementById('lbImg');im.src=IMG[key];im.style.display='block';
  document.getElementById('lbCap').textContent='📷 '+cap+' · '+(LANG==='zh'?'图片来自 Wikimedia Commons':'Photo: Wikimedia Commons');
  document.getElementById('lb').classList.add('show');}
function toggleFull(){var el=document.getElementById('view-line');
  if(!document.fullscreenElement){if(el.requestFullscreen)el.requestFullscreen();}else{document.exitFullscreen();}
  setTimeout(function(){if(lineMap)lineMap.resize();},300);}
/* 导出行程图: 用 canvas 合成地图截图 */
function exportTrip(){
  if(!lineMap){alert('地图未就绪');return;}
  try{
    var mapCanvas=lineMap.getCanvas();
    var W=mapCanvas.width,H=mapCanvas.height;
    var c=document.createElement('canvas');c.width=W;c.height=H+120;var ctx=c.getContext('2d');
    ctx.fillStyle='#FCFAF5';ctx.fillRect(0,0,W,H+120);
    ctx.drawImage(mapCanvas,0,0);
    ctx.fillStyle='#3A342B';ctx.font='bold 34px serif';ctx.fillText('Emily in Paris · 巴黎故事线',30,H+52);
    ctx.fillStyle='#867B69';ctx.font='22px sans-serif';ctx.fillText('Lemi\'s Diary · 7 站 · '+STOPS.map(function(s){return s.nm.zh;}).slice(0,3).join(' → ')+' …',30,H+90);
    var url=c.toDataURL('image/png');var a=document.createElement('a');a.href=url;a.download='lemi-paris-trip.png';a.click();
  }catch(e){alert(LANG==='zh'?'导出需地图完全加载后重试(部分浏览器限制 canvas 导出)':'Export needs the map fully loaded');}
}
function onLangLine(){renderStops();var s=STOPS[curStop];if(popup&&lineMap)popup.setHTML(popHTML(s));}

document.addEventListener('keydown',function(e){if(curView!=='line'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();stopAuto();stepStop(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();stopAuto();stepStop(-1);}
  else if(e.key==='Home'){e.preventDefault();stopAuto();selectStop(0);}
  else if(e.key==='End'){e.preventDefault();stopAuto();selectStop(STOPS.length-1);}});
window.addEventListener('resize',function(){if(curView==='line'&&lineMap)lineMap.resize();});

</script>
<script>
var LANG='zh',curView='world';
function showView(v){document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active');});document.getElementById('view-'+v).classList.add('active');curView=v;setCrumb();}
function goWorld(){showView('world');if(!worldMap)renderWorld();}
function enterHub(){showView('hub');setTab('wall');document.getElementById('suggest').classList.remove('show');}
function setCrumb(){var c=document.getElementById('crumb');if(curView==='world')c.innerHTML='';else if(curView==='hub')c.innerHTML='<b>巴黎</b>';else c.innerHTML='<b>巴黎</b><span class="sep">/</span>Emily in Paris';}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';document.getElementById('langBtn').textContent=LANG==='zh'?'中 / EN':'EN / 中';renderWorld();setCrumb();if(curView==='hub')setTab(curTab);if(curView==='line')onLangLine();}
renderWorld();setCrumb();
(function(){var m=location.hash.match(/stop=(\d+)/);if(m){enterHub();enterLine();pendingStop=Math.max(0,Math.min(6,+m[1]-1));}})();
</script>
</body>
</html>
