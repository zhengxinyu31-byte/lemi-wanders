<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemi 巴黎 · 16 种人格的旅行手账</title>
<script src="paris-data.js"></script>
<script src="paris-routes.js"></script>
<style>
:root{
  --ink:#2b2620; --paper:#f5efe3; --paper2:#efe7d6; --champ:#c9a45c;
  --rose:#b06a6f; --seine:#4a6f7a; --muted:#8a8073; --line:#d9cfb8;
  --shadow:0 18px 50px rgba(43,38,32,.18);
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.serif{font-family:var(--serif)}

#app{position:fixed;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:scale(1.015);pointer-events:none;
  transition:opacity .7s ease,transform .7s ease,visibility 0s .7s}
.scene.on{opacity:1;visibility:visible;transform:scale(1);pointer-events:auto;transition:opacity .7s ease,transform .7s ease}

#cover{align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(160deg,#211d18 0%,#3a322a 55%,#4a3f33 100%);color:var(--paper)}
#cover .kicker{letter-spacing:.5em;font-size:12px;color:var(--champ);margin-bottom:26px;text-transform:uppercase}
#cover h1{font-family:var(--serif);font-weight:600;font-size:clamp(40px,7vw,86px);line-height:1.08;letter-spacing:.02em}
#cover h1 .accent{color:var(--champ);font-style:italic}
#cover .sub{margin-top:22px;font-size:15px;color:#cbbfa9;max-width:560px;line-height:1.9}
#cover .meta{margin-top:14px;font-size:12px;letter-spacing:.3em;color:#8f8472}
.btn-primary{margin-top:46px;padding:15px 46px;background:var(--champ);color:#211a10;
  font-size:15px;letter-spacing:.18em;border-radius:2px;box-shadow:0 10px 30px rgba(201,164,92,.35);
  transition:transform .25s ease,box-shadow .25s ease}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(201,164,92,.5)}
.btn-ghost{padding:11px 26px;border:1px solid var(--line);color:var(--ink);border-radius:2px;font-size:13px;letter-spacing:.12em;transition:.25s}
.btn-ghost:hover{border-color:var(--champ);color:var(--champ)}
.btn-ghost.dark{border-color:#5a5145;color:#cdc2ae}
.btn-ghost.dark:hover{border-color:var(--champ);color:var(--champ)}

#quiz{background:var(--paper)}
.quiz-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto;padding:40px 28px}
.quiz-top{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.quiz-dim{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.progress{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--champ);width:0;transition:width .5s cubic-bezier(.22,1,.36,1)}
.quiz-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-num{font-family:var(--serif);font-size:13px;color:var(--champ);letter-spacing:.3em;margin-bottom:14px}
.q-text{font-family:var(--serif);font-size:clamp(22px,3vw,32px);line-height:1.5;margin-bottom:40px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:20px 24px;margin-bottom:14px;background:#fffdf8;
  border:1px solid var(--line);border-left:3px solid transparent;border-radius:3px;
  font-size:16px;line-height:1.6;transition:.25s cubic-bezier(.22,1,.36,1)}
.opt:hover{border-color:var(--champ);border-left-color:var(--champ);transform:translateX(6px);background:#fff}
.opt.picked{border-color:var(--champ);border-left-color:var(--champ);background:#faf3e2}

#result{background:linear-gradient(165deg,#26211b,#3d352b);color:var(--paper)}
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;max-width:760px;margin:0 auto}
.r-code{font-size:13px;letter-spacing:.6em;color:var(--champ);margin-bottom:18px}
.r-name{font-family:var(--serif);font-size:clamp(46px,8vw,92px);font-weight:600;line-height:1.1}
.r-tag{margin-top:18px;font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.4vw,26px);color:#e7d9bd}
.r-desc{margin-top:26px;font-size:15px;line-height:2;color:#cabfaa;max-width:560px}
.r-tags{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.r-chip{font-size:12px;padding:7px 15px;border:1px solid #5a5145;border-radius:30px;color:#cdc2ae;letter-spacing:.08em}
.r-actions{margin-top:44px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.r-dims{margin-top:30px;display:flex;gap:22px;font-size:11px;color:#8f8472;letter-spacing:.1em;flex-wrap:wrap;justify-content:center}
.r-dims b{color:var(--champ);font-weight:600}

#journey{background:#000}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.55}
.maplibregl-ctrl-bottom-right{margin:0 14px 22px}

.j-top{position:absolute;top:0;left:0;right:0;z-index:5;padding:20px 26px;
  display:flex;align-items:center;gap:16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,17,13,.72),transparent)}
.j-persona{display:flex;align-items:center;gap:12px;pointer-events:auto}
.j-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 12px currentColor}
.j-pname{font-family:var(--serif);color:#f3ead8;font-size:17px}
.j-pcode{font-size:10px;letter-spacing:.2em;color:var(--champ);margin-top:2px}
.j-spacer{flex:1}
.j-actions{display:flex;gap:10px;pointer-events:auto}
.mini-btn{font-size:12px;color:#e7dcc6;border:1px solid rgba(231,220,198,.3);padding:8px 14px;border-radius:2px;
  backdrop-filter:blur(6px);background:rgba(20,17,13,.35);transition:.25s;letter-spacing:.08em}
.mini-btn:hover{border-color:var(--champ);color:var(--champ)}

.stage{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 26px 30px;
  display:flex;justify-content:center;pointer-events:none}
.card{width:min(640px,92vw);pointer-events:auto;
  background:linear-gradient(180deg,rgba(34,29,23,.86),rgba(26,22,17,.93));
  backdrop-filter:blur(14px);border:1px solid rgba(201,164,92,.28);border-radius:6px;
  padding:26px 30px 24px;box-shadow:var(--shadow);color:#efe7d6;
  transform:translateY(30px);opacity:0;transition:opacity .8s ease .15s,transform .8s cubic-bezier(.22,1,.36,1) .15s}
.card.show{transform:translateY(0);opacity:1}
.card .c-kicker{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.c-idx{font-family:var(--serif);font-size:13px;color:var(--champ);letter-spacing:.2em;font-variant-numeric:tabular-nums}
.c-cat{font-size:10px;padding:3px 9px;border:1px solid rgba(201,164,92,.4);border-radius:20px;color:#d8c290}
.c-area{font-size:11px;color:#a99e8a;margin-left:auto}
.card h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,3.2vw,32px);line-height:1.25;margin-bottom:4px;color:#f7efe0}
.card .fr{font-size:12px;font-style:italic;color:#b3a88f;letter-spacing:.04em;margin-bottom:14px}
.card .hook{font-family:var(--serif);font-size:16px;line-height:1.75;color:#ecd9b0;font-style:italic;
  border-left:2px solid var(--champ);padding-left:14px;margin-bottom:14px}
.card .open{font-size:14px;line-height:1.8;color:#d8cfbd;background:rgba(201,164,92,.08);
  border-radius:4px;padding:11px 14px;margin-bottom:14px}
.card .open b{color:var(--champ);font-weight:600}
.card .tip{font-size:12.5px;line-height:1.7;color:#a99e8a;display:flex;gap:8px}
.card .tip b{color:#c9b78a;flex:none}
.card-nav{display:flex;align-items:center;gap:14px;margin-top:20px}
.nav-btn{flex:1;padding:13px;border:1px solid rgba(201,164,92,.4);border-radius:3px;color:#f0e6d2;
  font-size:14px;letter-spacing:.12em;transition:.25s;background:rgba(201,164,92,.06)}
.nav-btn:hover:not(:disabled){background:rgba(201,164,92,.2);border-color:var(--champ)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed}
.nav-btn.primary{background:var(--champ);color:#241c10;border-color:var(--champ);font-weight:600}
.nav-btn.primary:hover{background:#d8b56e}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(231,220,198,.22);transition:.4s}
.dot.done{background:var(--champ);box-shadow:0 0 8px rgba(201,164,92,.7)}
.dot.cur{background:#f3ead8;transform:scale(1.4)}

.intro-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
  color:#efe7d6;text-align:center;pointer-events:none;opacity:0;transition:opacity 1s ease}
.intro-hint.on{opacity:1}
.intro-hint .big{font-family:var(--serif);font-size:clamp(28px,5vw,54px);line-height:1.3;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.intro-hint .small{margin-top:16px;font-size:13px;letter-spacing:.3em;color:var(--champ)}

#ending{align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(165deg,#221d17,#3a3128);color:var(--paper)}
.end-wrap{padding:44px 30px;max-width:680px}
.end-kicker{font-size:12px;letter-spacing:.5em;color:var(--champ);margin-bottom:22px}
.end-title{font-family:var(--serif);font-size:clamp(30px,5vw,52px);line-height:1.3;font-weight:600;margin-bottom:8px}
.end-line{font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.4vw,22px);color:#e3d2ac;line-height:1.9;margin:26px 0 30px}
.lit-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.lit{font-size:12px;padding:7px 13px;border:1px solid rgba(201,164,92,.4);border-radius:30px;color:#e7d9bd}
.lit .ck{color:var(--champ);margin-right:6px}
.end-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,90vw);z-index:20;
  background:rgba(28,24,19,.97);backdrop-filter:blur(16px);border-left:1px solid rgba(201,164,92,.25);
  transform:translateX(100%);transition:transform .55s cubic-bezier(.22,1,.36,1);overflow-y:auto;padding:26px 22px}
.drawer.on{transform:translateX(0)}
.drawer h3{font-family:var(--serif);color:#f0e6d2;font-size:20px;margin-bottom:4px}
.drawer .dh{font-size:12px;color:#a99e8a;margin-bottom:20px;line-height:1.7}
.pcard{display:block;width:100%;text-align:left;padding:14px 15px;margin-bottom:9px;border-radius:4px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:.2s}
.pcard:hover{background:rgba(201,164,92,.12);border-color:rgba(201,164,92,.4)}
.pcard .pt{display:flex;align-items:center;gap:9px}
.pcard .pd{width:8px;height:8px;border-radius:50%;flex:none}
.pcard .pn{font-family:var(--serif);color:#ece2ce;font-size:15px}
.pcard .pc{margin-left:auto;font-size:10px;letter-spacing:.15em;color:var(--champ)}
.pcard .pl{font-size:11px;color:#9c917e;margin-top:5px;line-height:1.5}
.drawer-close{position:absolute;top:18px;right:20px;color:#cbbfa9;font-size:22px;line-height:1}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:640px){.card{padding:20px}.j-pname{font-size:15px}}
</style>
</head>
<body>
<div id="app">

  <section class="scene on" id="cover">
    <div class="fade">
      <div class="kicker">Lemi · Paris Storylines</div>
      <h1>十六种人格的<br><span class="accent">巴黎旅行手账</span></h1>
      <p class="sub">同一座城市，十六种走法。<br>先回答 12 个问题，找到你的旅行人格，巴黎会为你亮起一条只属于你的故事线。</p>
      <div class="meta">真实地图 · 真实坐标 · 一场可交互的微纪录片</div>
      <button class="btn-primary" onclick="App.startQuiz()">开始测试</button>
    </div>
  </section>

  <section class="scene" id="quiz">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <span class="quiz-dim" id="qDim"></span>
        <div class="progress"><i id="qBar"></i></div>
        <span class="quiz-count" id="qCount"></span>
      </div>
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div id="qOpts"></div>
    </div>
  </section>

  <section class="scene" id="result">
    <div class="result-wrap">
      <div class="r-code" id="rCode"></div>
      <div class="r-name serif" id="rName"></div>
      <div class="r-tag" id="rTag"></div>
      <p class="r-desc" id="rDesc"></p>
      <div class="r-tags" id="rTags"></div>
      <div class="r-dims" id="rDims"></div>
      <div class="r-actions">
        <button class="btn-primary" onclick="App.enterJourney()">进入我的巴黎故事线 →</button>
        <button class="btn-ghost dark" onclick="App.retake()">重新测试</button>
      </div>
    </div>
  </section>

  <section class="scene" id="journey">
    <div id="map"></div>
    <div class="intro-hint" id="introHint">
      <div class="big serif" id="introBig"></div>
      <div class="small" id="introSmall"></div>
    </div>
    <div class="j-top">
      <div class="j-persona">
        <span class="j-dot" id="jDot"></span>
        <div>
          <div class="j-pname" id="jPname"></div>
          <div class="j-pcode" id="jPcode"></div>
        </div>
      </div>
      <div class="j-spacer"></div>
      <div class="j-actions">
        <button class="mini-btn" onclick="App.toggleDrawer()">16 条故事线</button>
        <button class="mini-btn" onclick="App.retake()">重测</button>
      </div>
    </div>
    <div class="stage">
      <div class="card" id="card">
        <div class="dots" id="dots"></div>
        <div class="c-kicker">
          <span class="c-idx" id="cIdx"></span>
          <span class="c-cat" id="cCat"></span>
          <span class="c-area" id="cArea"></span>
        </div>
        <h2 id="cName"></h2>
        <div class="fr" id="cFr"></div>
        <div class="hook" id="cHook"></div>
        <div class="open"><b>你的打开方式 · </b><span id="cOpen"></span></div>
        <div class="tip"><b>Tips</b><span id="cTip"></span></div>
        <div class="card-nav">
          <button class="nav-btn" id="prevBtn" onclick="App.prev()">← 上一站</button>
          <button class="nav-btn primary" id="nextBtn" onclick="App.next()">下一站</button>
        </div>
      </div>
    </div>
  </section>

  <section class="scene" id="ending">
    <div class="end-wrap">
      <div class="end-kicker">FIN · 我的巴黎手账</div>
      <div class="end-title serif" id="endTitle"></div>
      <div class="end-line serif" id="endLine"></div>
      <div class="lit-list" id="litList"></div>
      <div class="end-actions">
        <button class="btn-primary" onclick="App.replay()">重走这条线</button>
        <button class="btn-ghost dark" onclick="App.openDrawer()">换一条人格线</button>
        <button class="btn-ghost dark" onclick="App.retake()">重新测试</button>
      </div>
    </div>
  </section>

  <aside class="drawer" id="drawer">
    <button class="drawer-close" onclick="App.closeDrawer()">×</button>
    <h3>16 条故事线</h3>
    <div class="dh">核心地标相同，走法截然不同。<br>点任意一张，用另一种人格重游巴黎。</div>
    <div id="drawerList"></div>
  </aside>

</div>

<script>
const Q=[
 {dim:"culture",q:"哪种旅行地最容易让你一秒心动？",o:[["厚重的历史底蕴，藏着好多故事",2],["有烟火气的城市，边吃边逛最快乐",1],["绝美山海，沉醉于自然风光",0]]},
 {dim:"culture",q:"到了一个景点，你的打开方式？",o:[["做足功课，历史、名人、典故都想知道",2],["先找最佳机位，来一趟必出片",1],["随便走走，看到有意思的介绍就多停会儿",0]]},
 {dim:"culture",q:"旅行结束，你最爱的“战利品”？",o:[["有地方故事的工艺品或书画，越有来历越喜欢",2],["特产或免税好物，拿在手里最安心",1],["满相册的美照、明信片、冰箱贴",0]]},
 {dim:"social",q:"如果只能选一种旅行方式，你会？",o:[["一群人热热闹闹，认识新朋友超快乐",2],["和几个熟悉的朋友一起，舒服又有安全感",1],["一个人出发，轻松又自在",0]]},
 {dim:"social",q:"吃饭时听到邻桌在聊当地玩法，你会？",o:[["直接凑过去搭话：“姐妹求推荐！”",2],["悄悄听两句，默默记在心里",1],["专心干饭，左耳进右耳出",0]]},
 {dim:"social",q:"旅行中迷路了，你第一反应？",o:[["立刻抓个本地人问路，顺便唠唠嗑",2],["先自己找找，实在不行再问工作人员",1],["靠自己解决，不太想麻烦别人",0]]},
 {dim:"planning",q:"出发前一周，你的状态？",o:[["精确到分钟的攻略，万事俱备",2],["大概记下几个想去的地方，其他全凭心情",1],["到了再说，灵感会带路",0]]},
 {dim:"planning",q:"如果当天突然下雨打乱计划，你会？",o:[["马上切换备选方案，确保行程不跑偏",2],["问题不大，灵活调整成室内游",1],["换个玩法也有意思，反而像开了隐藏支线",0]]},
 {dim:"planning",q:"你最舒服的旅行节奏是？",o:[["安排得明明白白，心里才踏实",2],["打卡必去点，都不白来",1],["走到哪算哪，当下开心最重要",0]]},
 {dim:"spending",q:"你的旅行花销大头在？",o:[["住宿和体验，舒服才是硬道理",2],["很平均，该省省该花花",1],["交通！用最少的钱去最多的地方",0]]},
 {dim:"spending",q:"热门景点要排 1 小时，你会？",o:[["果断加！时间比这点钱宝贵多了",2],["看情况，太晒太累就加钱",1],["硬排，能省则省",0]]},
 {dim:"spending",q:"当地超火的游客体验项目，你？",o:[["来都来了！必须安排，不留遗憾",2],["价格合适会想试试看",1],["找平替或直接跳过，没必要花这钱",0]]}
];
const DIMNAME={culture:"文化",planning:"规划",social:"社交",spending:"消费"};

const App={
 score:{culture:0,planning:0,social:0,spending:0},
 qi:0, persona:null, route:null, si:0, map:null, markers:[], lit:new Set(),

 show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));
   document.getElementById(id).classList.add('on');},
 startQuiz(){this.score={culture:0,planning:0,social:0,spending:0};this.qi=0;this.answering=false;this.show('quiz');this.renderQ();},
 renderQ(){
   const item=Q[this.qi];
   document.getElementById('qDim').textContent=DIMNAME[item.dim]+" 维度";
   document.getElementById('qCount').textContent=(this.qi+1)+" / 12";
   document.getElementById('qBar').style.width=(this.qi/12*100)+"%";
   document.getElementById('qNum').textContent="QUESTION "+String(this.qi+1).padStart(2,'0');
   document.getElementById('qText').textContent=item.q;
   const box=document.getElementById('qOpts');box.innerHTML="";
   item.o.forEach(([txt,pts])=>{
     const b=document.createElement('button');b.className='opt';b.textContent=txt;
     b.onclick=()=>this.answer(pts,b);box.appendChild(b);
   });
 },
 answer(pts,el){
   if(this.answering)return;              // 320ms 过渡内锁定，防止双击重复计分/跳题
   this.answering=true;
   const dim=Q[this.qi].dim;              // 固定捕获当前题维度，避免异步期间 qi 变化
   el.classList.add('picked');
   this.score[dim]+=pts;
   document.querySelectorAll('#qOpts .opt').forEach(b=>b.disabled=true);
   setTimeout(()=>{this.answering=false;this.qi++; if(this.qi<Q.length)this.renderQ(); else this.compute();},320);
 },
 hi(v){return v>=4;},
 compute(){
   const s=this.score;
   const C=this.hi(s.culture),P=this.hi(s.planning),S=this.hi(s.social),M=this.hi(s.spending);
   const M4={
    "1111":"GOAT","1110":"CTRL","1101":"BLUE","1100":"NERD",
    "1011":"DODO","1010":"MYTH","1001":"LORD","1000":"BUDD",
    "0111":"BOSS","0110":"TIME","0101":"FREE","0100":"WIND",
    "0011":"SHAN","0010":"BEE","0001":"REST","0000":"CUTE"
   };
   const code=M4[`${C?1:0}${P?1:0}${S?1:0}${M?1:0}`];
   this.persona=PARIS.personas.find(p=>p.code===code);
   this.route=ROUTES[code];
   document.getElementById('qBar').style.width="100%";
   this.renderResult();
 },
 renderResult(){
   const p=this.persona;
   document.getElementById('rCode').textContent=p.code;
   document.getElementById('rName').textContent=p.name;
   document.getElementById('rTag').textContent="“"+p.tagline+"”";
   document.getElementById('rDesc').textContent=p.desc;
   document.getElementById('rTags').innerHTML=
     `<span class="r-chip">${p.vibe}</span><span class="r-chip">${p.pace}</span><span class="r-chip">预算 ${p.budget}</span>`;
   const s=this.score;
   document.getElementById('rDims').innerHTML=
     ["culture","planning","social","spending"].map(d=>
       `${DIMNAME[d]}·${this.hi(s[d])?"高":"低"}`).join("　·　");
   this.show('result');
 },
 retake(){this.closeDrawer();this.startQuiz();},

 enterJourney(){
   this.show('journey');this.si=0;this.lit=new Set();
   document.getElementById('jDot').style.color=this.persona.color;
   document.getElementById('jPname').textContent=this.persona.name+"的线路";
   document.getElementById('jPcode').textContent=this.persona.code+" · "+this.route.title;
   this.renderCard();          // 卡片/故事先行，地图为增强层
   if(this.map){
     // 重走/重测再进入：地图实例已在，样式就绪则直接重绘，不再回到 loading 态
     const ready=()=>{this.mapReady=true;this.clearRoute();this.drawRoute();this.playIntro();};
     if(this.map.loaded&&this.map.loaded()&&(!this.map.isStyleLoaded||this.map.isStyleLoaded()))ready();
     else{this.mapReady=false;this.showMapHint("地图加载中…");this.map.once('load',ready);}
   }else{
     this.mapReady=false;
     this.showMapHint("地图加载中…");
     this.loadMaplibre().then(()=>{
       this.initMap();this.map.once('load',()=>{this.mapReady=true;this.drawRoute();this.playIntro();});
     }).catch(()=>{this.mapReady=false;this.showMapHint("地图资源加载受限，故事照读 ↓");this.cardIntro();});
   }
 },
 cardIntro(){const h=document.getElementById('introHint');
   document.getElementById('introBig').textContent=this.persona.name+" · 出发";
   document.getElementById('introSmall').textContent=this.route.title;
   h.classList.add('on');setTimeout(()=>h.classList.remove('on'),2600);},
 showMapHint(t){const h=document.getElementById('introHint');
   document.getElementById('introBig').textContent=t;
   document.getElementById('introSmall').textContent="";
   h.classList.add('on');clearTimeout(this._hintT);
   this._hintT=setTimeout(()=>{if(t.indexOf("加载中")<0)h.classList.remove('on');},2600);},
 loadMaplibre(){
   if(window.maplibregl)return Promise.resolve();
   return new Promise((res,rej)=>{
     const css=document.createElement('link');css.rel='stylesheet';
     css.href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css';
     document.head.appendChild(css);
     const s=document.createElement('script');
     s.src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js';
     s.onload=()=>res();s.onerror=()=>rej();document.head.appendChild(s);
   });
 },
 initMap(){
   this.map=new maplibregl.Map({container:'map',
     style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
     center:[2.34,48.862],zoom:12.4,pitch:46,bearing:-8,
     attributionControl:true,fadeDuration:0});
   this.map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
   this.map.scrollZoom.setWheelZoomRate(1/600);
 },
 clearRoute(){this.markers.forEach(m=>m.remove());this.markers=[];
   ['route-l','route-g'].forEach(l=>{if(this.map.getLayer(l))this.map.removeLayer(l);});
   ['route','ghost'].forEach(src=>{if(this.map.getSource(src))this.map.removeSource(src);});
 },
 drawRoute(){
   if(!this.mapReady||!this.map)return;
   const coords=this.route.stops.map(st=>PARIS.pois[st.id].c);
   this.clearRoute();
   this.map.addSource('ghost',{type:'geojson',data:{type:'Feature',
     geometry:{type:'LineString',coordinates:coords},properties:{}}});
   this.map.addLayer({id:'route-g',type:'line',source:'ghost',
     paint:{'line-color':'#c9a45c','line-width':2,'line-opacity':.22,'line-dasharray':[2,2]}});
   this.map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
   this.map.addLayer({id:'route-l',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},
     paint:{'line-color':'#c9a45c','line-width':3.5,'line-opacity':.95,'line-blur':.4}});
   this.route.stops.forEach((st,i)=>{
     const poi=PARIS.pois[st.id];
     const el=document.createElement('div');
     el.style.cssText=`width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       font-family:Georgia;font-size:13px;font-weight:700;color:#2a2113;
       background:rgba(245,239,227,.92);border:2px solid ${this.persona.color};
       box-shadow:0 3px 12px rgba(0,0,0,.4);cursor:pointer;transition:transform .3s,background .3s,color .3s`;
     el.textContent=i+1;
     const mk=new maplibregl.Marker({element:el}).setLngLat(poi.c).addTo(this.map);
     el.addEventListener('click',()=>App.goTo(i));
     this.markers.push(mk);
   });
   this.syncMap();
 },
 playIntro(){
   if(!this.mapReady){this.cardIntro();return;}
   const h=document.getElementById('introHint');
   document.getElementById('introBig').textContent=this.persona.name+" · 出发";
   document.getElementById('introSmall').textContent=this.route.title;
   h.classList.add('on');
   this.map.flyTo({center:[2.34,48.862],zoom:11.8,pitch:42,bearing:0,duration:2600,essential:true});
   setTimeout(()=>{h.classList.remove('on');this.goTo(0);},3000);
 },
 goTo(i){
   this.si=i;const st=this.route.stops[i],poi=PARIS.pois[st.id];
   if(this.mapReady&&this.map.getSource('route')){
     const seg=this.route.stops.slice(0,i+1).map(x=>PARIS.pois[x.id].c);
     this.map.getSource('route').setData({type:'Feature',
       geometry:{type:'LineString',coordinates:seg},properties:{}});
     const here=this.map.getCenter();
     const d=Math.hypot(here.lng-poi.c[0],here.lat-poi.c[1]);
     const cam={center:[poi.c[0]-0.006,poi.c[1]-0.004],zoom:13.4,pitch:48,bearing:-6,essential:true};
     if(d>0.03)this.map.flyTo(Object.assign(cam,{speed:0.7,curve:1.5}));
     else this.map.easeTo(Object.assign(cam,{duration:700}));  // 相邻近站直切，固定短时长，避免极慢动画
   }
   this.markers.forEach((m,k)=>{const e=m.getElement();
     e.style.transform=(k===i)?'scale(1.35)':'scale(1)';
     if(k<=i){e.style.background=this.persona.color;e.style.color='#fff';}
     else{e.style.background='rgba(245,239,227,.92)';e.style.color='#2a2113';}});
   this.renderCard();
 },
 syncMap(){ if(this.mapReady)this.goTo(this.si); },
 renderCard(){
   const i=this.si,st=this.route.stops[i],poi=PARIS.pois[st.id],n=this.route.stops.length;
   const card=document.getElementById('card');
   card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
   document.getElementById('cIdx').textContent="STATION "+String(i+1).padStart(2,'0')+" / "+String(n).padStart(2,'0');
   document.getElementById('cCat').textContent=poi.cat;
   document.getElementById('cArea').textContent=poi.area;
   document.getElementById('cName').textContent=poi.n;
   document.getElementById('cFr').textContent=poi.fr;
   document.getElementById('cHook').textContent="「 "+poi.hook+" 」";
   document.getElementById('cOpen').textContent=st.open;
   document.getElementById('cTip').textContent=poi.tip;
   document.getElementById('prevBtn').disabled=(i===0);
   document.getElementById('nextBtn').textContent=(i===n-1)?'点亮全图，合上这一页 →':'下一站 →';
   document.getElementById('dots').innerHTML=this.route.stops.map((_,k)=>
     `<span class="dot ${k<i?'done':''} ${k===i?'cur':''}"></span>`).join('');
 },
 next(){
   this.lit.add(this.route.stops[this.si].id);
   if(this.si<this.route.stops.length-1){this.goTo(this.si+1);}else{this.finish();}
 },
 prev(){if(this.si>0)this.goTo(this.si-1);},
 finish(){
   this.route.stops.forEach(s=>this.lit.add(s.id));
   document.getElementById('endTitle').textContent=this.persona.name+"，这是你的巴黎";
   document.getElementById('endLine').textContent=this.route.end;
   document.getElementById('litList').innerHTML=this.route.stops.map(s=>
     `<span class="lit"><span class="ck">✦</span>${PARIS.pois[s.id].n}</span>`).join('');
   this.closeDrawer();this.show('ending');
 },
 replay(){this.enterJourney();},

 openDrawer(){document.getElementById('drawer').classList.add('on');this.drawerOpen=true;if(!this.drawerB){this.buildDrawer();this.drawerB=1;}},
 closeDrawer(){document.getElementById('drawer').classList.remove('on');this.drawerOpen=false;},
 toggleDrawer(){this.drawerOpen?this.closeDrawer():this.openDrawer();},
 buildDrawer(){
   const list=document.getElementById('drawerList');list.innerHTML="";
   PARIS.personas.filter(p=>!p.hidden).forEach(p=>{
     const r=ROUTES[p.code];const b=document.createElement('button');b.className='pcard';
     b.innerHTML=`<div class="pt"><span class="pd" style="background:${p.color}"></span>
       <span class="pn">${p.name}</span><span class="pc">${p.code}</span></div>
       <div class="pl">${r.title}</div>`;
     b.onclick=()=>{this.persona=p;this.route=ROUTES[p.code];this.closeDrawer();
       document.getElementById('jDot').style.color=p.color;
       document.getElementById('jPname').textContent=p.name+"的线路";
       document.getElementById('jPcode').textContent=p.code+" · "+r.title;
       this.si=0;this.lit=new Set();
       this.show('journey');this.renderCard();
       if(this.mapReady){this.clearRoute();this.drawRoute();this.playIntro();}
       else this.cardIntro();};
     list.appendChild(b);
   });
 }
};
</script>
</body>
